# SVAMP: frozen replication benchmark (Section 6). Must only be touched
# after the taxonomy, causal metrics, matching criteria, and statistical
# tests have all been frozen on GSM8K. Do NOT tune anything on this file's
# outputs before the confirmatory replication (script 16).
benchmark: svamp
hf_dataset: ChilleD/SVAMP
split: test
role: frozen_replication

raw_path: data/raw/svamp
variants_path: data/variants/svamp
generations_path: data/generations/svamp
pairs_path: data/pairs/svamp

n_variants_per_problem: 8
target_n_pairs: 150
min_n_pairs: 80

perturbation_families:
  - name_swap
  - number_format
  - lexical_conservative

answer_regex: '####\s*([\-0-9,\.]+)'

reasoning_prompt: |
  Solve the following problem carefully.

  Give your reasoning in short numbered steps.
  Each step should contain one main operation or inference.

  Finish with exactly:
  #### <numeric answer>

  Problem:
  {question}

# Mapping novel SVAMP descriptions onto the GSM8K-frozen taxonomy is allowed
# to produce "unmapped/novel" labels (Section 40) - it must not retrain the
# clustering.
taxonomy_path: data/taxonomy/taxonomy_v1.json
allow_novel_labels: true
